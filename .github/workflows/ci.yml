name: CI

# Nothing here runs by itself on an ordinary push. That is deliberate: CI is
# started by hand, or by a version tag, and never by the act of committing.
#
# **To cut a release, and this is the only place it happens:**
#
#   Actions -> CI (in the left sidebar) -> "Run workflow" -> type a version
#   into the box, e.g. v0.5.0 -> Run workflow.
#
#   The "Run workflow" button only appears once you have selected **CI** in the
#   left sidebar. The "All workflows" view does not show it, which is the usual
#   reason for not being able to find it.
#
# Or, equivalently, from a terminal:
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Leaving the version box empty runs the tests and builds the plugins without
# cutting a release, which is what you want before tagging.
#
# Why no push trigger: every commit used to start a run, and because
# cancel-in-progress kills the previous one, a normal working session left a
# column of cancelled runs and burned macOS minutes (billed at 10x on private
# repositories) on builds nobody was going to download. Run it when you want an
# answer.
#
# **Windows only, by default.** The rig is Windows 11 and FL Studio, and the
# loop that matters is build -> load -> play -> say what is wrong. macOS is not
# in that loop yet: nobody has loaded any of these in a Mac DAW, so a macOS
# build is an artefact nobody downloads, and it is by far the most expensive
# thing here -- run 38's macOS plugin job spent six hours in the link before it
# was cancelled. The emulated ARM64 suite goes with it, since Apple Silicon is
# what it is for.
#
# To cover everything -- before a release, or once macOS testing starts --
# choose **all** in the "platforms" box. A tag push covers Windows only; tag a
# release after a manual `all` run has passed if you want Mac binaries in it.
#
# **The "plugins" box narrows what gets built**, and only that: the DSP tests
# always cover the whole tree, because they are framework-free and cost a
# minute. `ALL` is the default; a comma-separated list builds just those. It
# exists so an expensive platform can be proved on one plugin before the suite
# is committed to it -- which is exactly how the first macOS/Apple-Silicon run
# was done, as `v0.88.8-sonitus`, before `v0.88.8` went for all twelve.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Cut a release with this version (e.g. v0.5.0). Leave empty to just test and build.'
        required: false
        type: string
      platforms:
        description: 'Which platforms to cover. Windows is the rig; macOS is expensive and not being tested yet.'
        required: false
        default: windows
        type: choice
        options: [windows, all]
      plugins:
        description: 'Which plugins to build: ALL, or a comma-separated list (e.g. Sonitus). The DSP tests always cover everything.'
        required: false
        default: ALL
        type: string
      skip_tests:
        description: 'Skip the DSP tests and build the plugins directly. ONLY when they have already passed on this exact commit.'
        required: false
        default: false
        type: boolean

# Named so a dispatched run says what it is doing in the runs list, rather than
# repeating the commit subject of whatever happened to be at the top.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('{0} ({1}, {2})',
                inputs.release_version != ''
                  && format('Release {0}', inputs.release_version)
                  || 'Manual test and build',
                inputs.platforms,
                inputs.plugins)
      || format('Release {0} (windows, ALL)', github.ref_name) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not cancel-in-progress. Every run is now deliberate, and cancelling one
  # halfway through the release job would leave a tag with no binaries against
  # it. Two runs queueing is the correct behaviour when someone asked for both.
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # What this run covers, decided once so the three jobs below cannot disagree.
  #
  # A job listed in `needs` that gets skipped skips its dependents too, unless
  # they say otherwise -- which is why `build` and `release` below carry an
  # explicit `if` that accepts a skipped ARM64 job. That is the one sharp edge
  # in this arrangement and it is easy to trip over when adding a job.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
      plugins: ${{ steps.decide.outputs.plugins }}
      arm64: ${{ steps.decide.outputs.arm64 }}
      selection: ${{ steps.decide.outputs.selection }}
      run_tests: ${{ steps.decide.outputs.run_tests }}
    steps:
      - id: decide
        shell: bash
        # Through the environment, never interpolated into the script body:
        # workflow inputs are attacker-controlled on a public repository and
        # `${{ }}` inside a run block is textual substitution, so a value with
        # a quote and a semicolon in it would run as shell. The release job
        # below has taken the version this way since it was written; the same
        # applies to anything else typed into the form.
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_PLUGINS: ${{ inputs.plugins }}
          INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          # Empty on a tag push, because a tag carries no inputs. Windows is
          # the default there for the same reason it is the default here.
          platforms="${INPUT_PLATFORMS:-windows}"

          # Which plugins the build job compiles. ALL on a tag push, for the
          # same reason. Validated rather than trusted: this string reaches a
          # -D flag, and CMake would take almost anything.
          selection="${INPUT_PLUGINS:-ALL}"
          if ! printf '%s' "$selection" | grep -Eq '^[A-Za-z][A-Za-z0-9]*(,[A-Za-z][A-Za-z0-9]*)*$'; then
            echo "::error::'$selection' is not ALL or a comma-separated list of plugin names."
            exit 1
          fi
          # NONE is a legal value of TEZLA_PLUGINS and a nonsensical one here:
          # the build job would compile nothing and then fail on finding no
          # bundles, several minutes later and for a reason that reads like a
          # broken workflow. Say it now instead. A run that only wants the
          # tests is a run with no version typed into the release box; the
          # artefacts are simply ignored.
          if [ "$selection" = "NONE" ]; then
            echo "::error::plugins=NONE would build nothing for the plugin job to collect. Leave the release box empty for a tests-only run."
            exit 1
          fi

          # Skipping the tests is a deliberate, narrow act: it exists because a
          # runner can be *unavailable* rather than unhappy. The macOS DSP job
          # sat fifteen minutes without ever being assigned a runner, was
          # cancelled, and took the plugin build down with it -- while the same
          # commit passed on Linux, Windows and emulated ARM64. Refusing to
          # build in that situation protects nothing.
          #
          # It does NOT loosen the gate on a test that actually ran and failed:
          # `build` below still requires success-or-skipped, and a failure is
          # neither.
          run_tests=true
          [ "${INPUT_SKIP_TESTS:-false}" = "true" ] && run_tests=false

          if [ "$platforms" = "all" ]; then
            tests='[{"os":"ubuntu-latest","name":"Linux"},{"os":"windows-latest","name":"Windows"},{"os":"macos-latest","name":"macOS"}]'
            plugins='[{"os":"windows-latest","name":"Windows","artifact":"windows-vst3"},{"os":"macos-latest","name":"macOS","artifact":"macos-vst3-au"}]'
            arm64=true
          else
            # Linux stays even on a Windows run: it is 47 seconds, it is the
            # cheapest runner there is, and a numerical difference between GCC
            # and MSVC is exactly the kind of thing one compiler alone hides.
            tests='[{"os":"ubuntu-latest","name":"Linux"},{"os":"windows-latest","name":"Windows"}]'
            plugins='[{"os":"windows-latest","name":"Windows","artifact":"windows-vst3"}]'
            arm64=false
          fi

          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          [ "$run_tests" = "true" ] || arm64=false
          echo "arm64=$arm64" >> "$GITHUB_OUTPUT"
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"

          {
            echo "### Covering: $platforms"
            echo
            echo "- Plugins built: \`$selection\`"
            echo "- DSP tests: $(echo "$tests" | grep -o '"name":"[^"]*"' | cut -d'"' -f4 | paste -sd', ') (always the whole tree)"
            echo "- ARM64 (emulated): $arm64"
            echo "- Plugin builds on: $(echo "$plugins" | grep -o '"name":"[^"]*"' | cut -d'"' -f4 | paste -sd', ')"
            if [ "$platforms" != "all" ]; then
              echo
              echo "_macOS is skipped. Choose **all** in the platforms box to include it._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The framework-free DSP, on all three platforms. No JUCE, no download, no GUI
  # stack -- this is the whole point of keeping the DSP independent of the
  # plugin framework, and it means a platform-specific numerical bug shows up in
  # about a minute rather than after a full plugin build.
  # ---------------------------------------------------------------------------
  test:
    name: DSP tests (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.run_tests == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTEZLA_PLUGINS=NONE

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      # The measurement harness has bugs like any other code, and a run where it
      # silently mis-measures is worse than one that fails. Checking the
      # instrument before trusting it is a rule in CLAUDE.md.
      - name: Verify the measurement harness
        shell: bash
        run: |
          exe="$(find build -type f \( -name 'tezla-measure' -o -name 'tezla-measure.exe' \) | head -1)"
          if [ -z "$exe" ]; then
            echo "tezla-measure was not built" >&2
            exit 1
          fi
          "$exe" selftest

  # ---------------------------------------------------------------------------
  # Apple Silicon is ARM, and an x86-only assumption in the DSP compiles
  # cleanly, runs happily and does nothing there -- which is exactly how a
  # denormal guard that only handled x86 got as far as a release. Cross
  # compiling and running the suite under emulation catches that class of bug
  # on a Linux runner, in about a minute, without waiting for a Mac.
  # ---------------------------------------------------------------------------
  test-arm64:
    name: DSP tests (ARM64, emulated)
    needs: plan
    if: needs.plan.outputs.arm64 == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user

      - name: Configure
        run: |
          cmake -S . -B build-arm64 \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                -DCMAKE_EXE_LINKER_FLAGS="-static" \
                -DCMAKE_BUILD_TYPE=Release \
                -DTEZLA_PLUGINS=NONE

      - name: Build
        run: cmake --build build-arm64 --parallel

      # TEZLA_EMULATED tells the suite that wall-clock CPU budgets cannot be
      # trusted on this run. Measured on this tree, qemu-aarch64 costs 8.8x to
      # 29.8x native -- Ferrite's 15.8% of a core reads 139.4%, the 64-mode
      # resonator's 0.37% reads 11.02% -- so all five budget tests failed here
      # and not one of them was a defect. The work still runs and the figures
      # are still printed and labelled NOT ASSERTED; only the comparison is
      # withheld. A real Apple Silicon machine sets nothing and asserts.
      - name: Run the suite under emulation
        env:
          TEZLA_EMULATED: '1'
        run: qemu-aarch64 build-arm64/bin/tezla-tests

      - name: Verify the measurement harness
        env:
          TEZLA_EMULATED: '1'
        run: qemu-aarch64 build-arm64/bin/tezla-measure selftest

  # ---------------------------------------------------------------------------
  # The plugins themselves. Windows gets VST3; macOS gets VST3 and Audio Unit,
  # universal for Apple Silicon and Intel.
  # ---------------------------------------------------------------------------
  build:
    name: Plugins (${{ matrix.name }})
    needs: [plan, test, test-arm64]
    # `test-arm64` is skipped on a Windows-only run, and a skipped dependency
    # skips its dependents unless they say otherwise. Spelt out rather than
    # `always()`, so a genuine ARM64 failure still stops the build.
    if: >-
      ${{ !cancelled()
          && (needs.test.result == 'success' || needs.test.result == 'skipped')
          && (needs.test-arm64.result == 'success' || needs.test-arm64.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    # A ceiling for a HANG, not a budget for a build. Run 38's macOS job sat in
    # a monolithic LTO link for **six hours and four minutes** before a human
    # cancelled it, and macOS minutes bill at 10x; TEZLA_LTO being off by
    # default is the actual fix, and this is the backstop.
    #
    # It was 90 minutes and that was wrong -- a twelve-plugin *universal* macOS
    # build compiles every plugin twice over in two formats, and a healthy one
    # can legitimately run well past an hour. A guard that kills good builds is
    # worse than no guard: it turns a slow release into a failed one. 300 keeps
    # the backstop (GitHub's own default is 360) while leaving any real build
    # room to finish.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plugins) }}

    steps:
      - uses: actions/checkout@v4

      # JUCE is a few hundred MB and does not change between runs, so it is
      # cloned once and cached. The version is read from the CMake file rather
      # than repeated here, so there is only one place to change it.
      - name: Read the pinned JUCE version
        id: juce
        shell: bash
        run: |
          version="$(sed -n 's/.*TEZLA_JUCE_VERSION "\([^"]*\)".*/\1/p' cmake/FetchJUCE.cmake | head -1)"
          if [ -z "$version" ]; then
            echo "Could not read TEZLA_JUCE_VERSION from cmake/FetchJUCE.cmake" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned JUCE version: $version"

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ steps.juce.outputs.version }}-${{ runner.os }}

      - name: Clone JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: bash
        run: git clone --depth 1 --branch "${{ steps.juce.outputs.version }}" https://github.com/juce-framework/JUCE.git JUCE

      # TEZLA_LTO is deliberately left at its default of OFF and not passed
      # here: JUCE's recommended flag is a plain `-flto`, which on Apple clang
      # is monolithic whole-program LTO on one core, per format, twice over for
      # a universal binary. That is what cost run 38 six hours. See the comment
      # on the option in the root CMakeLists.txt.
      - name: Configure
        shell: bash
        env:
          PLUGIN_SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DTEZLA_PLUGINS="$PLUGIN_SELECTION" \
                -DTEZLA_JUCE_PATH="${{ github.workspace }}/JUCE" \
                -DTEZLA_BUILD_TESTS=OFF \
                -DTEZLA_BUILD_TOOLS=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # Bundles are directories on both platforms, hence -type d. That is not
      # cosmetic: on Windows a VST3 bundle is a folder containing
      # Contents/x86_64-win/Name.vst3, a *file* with the same extension, so
      # matching on the name alone collects the bundle and the DLL inside it.
      #
      # The empty check is here because upload-artifact will happily upload
      # nothing at all if the build quietly produced no bundles.
      - name: Collect the bundles
        shell: bash
        run: |
          mkdir -p staging
          found=0
          while IFS= read -r bundle; do
            echo "Found $bundle"
            cp -R "$bundle" staging/
            found=1
          done < <(find build -maxdepth 8 -type d \( -name '*.vst3' -o -name '*.component' \) -print)

          if [ "$found" -eq 0 ]; then
            echo "No plugin bundles were produced." >&2
            exit 1
          fi
          ls -la staging

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/
          if-no-files-found: error
          retention-days: 30

      # A skipped job on the run page says "Skipped" and nothing else. Putting
      # the reason and the remedy in the summary means nobody has to go and read
      # the workflow to find out why no release appeared.
      - name: Explain what happens next
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }} build"
            echo
            echo "Download from the **Artifacts** section at the bottom of this run."
            echo
            if [ "${{ runner.os }}" = "macOS" ]; then
              echo "macOS builds are universal and unsigned. Clear the quarantine"
              echo "attribute before your DAW will load them:"
              echo
              echo '```bash'
              echo 'xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/*.vst3'
              echo 'xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/*.component'
              echo '```'
              echo
            fi
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" != "true" ] \
               && [ -z "${{ github.event.inputs.release_version }}" ]; then
              echo "_No release was cut: this run had no version. That is the normal"
              echo "result of a test-and-build run, and the artifacts above are still"
              echo "yours to download._"
              echo
              echo "_To cut one: **Actions -> CI** in the left sidebar -> **Run workflow**"
              echo "-> type a version. The button only appears once CI is selected in the"
              echo "sidebar; the All workflows view does not show it. Or from a terminal:_"
              echo
              echo '```bash'
              echo 'git tag v0.5.0 && git push origin v0.5.0'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # A version tag turns the artefacts into a Release.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    # Two routes in: a version tag, or a manual run with a version typed in.
    # Same shape as `build` above, and for the same reason: a Windows-only run
    # skips the ARM64 job, and a skipped dependency would otherwise skip this.
    if: >-
      ${{ !cancelled()
          && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_version != '')
          && (needs.test.result == 'success' || needs.test.result == 'skipped')
          && needs.build.result == 'success'
          && (needs.test-arm64.result == 'success' || needs.test-arm64.result == 'skipped') }}
    needs: [plan, test, test-arm64, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Resolved through the environment rather than interpolated straight into
      # the script: workflow inputs are attacker-controlled on a public
      # repository, and `${{ }}` inside a run block is textual substitution.
      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"

          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version like v1.2.3 -- refusing to tag with it."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Download the built plugins
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          version="${{ steps.version.outputs.version }}"

          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::No artifacts were downloaded; nothing to release."
            exit 1
          fi

          for dir in artifacts/*/; do
            platform="$(basename "$dir")"
            # -y preserves the bundle structure; macOS bundles are directories
            # and a plain zip of the contents would not be loadable.
            (cd "$dir" && zip -qry "../../release/tezla-spectra-${version}-${platform}.zip" .)
          done

          ls -la release
          [ -n "$(ls -A release)" ] || { echo "::error::No zips were produced."; exit 1; }

      # Written to a file with a quoted heredoc rather than passed inline: the
      # notes contain backticks, backslashes and Windows paths, all of which a
      # double-quoted shell string would try to interpret.
      - name: Write the release notes
        shell: bash
        env:
          PLUGIN_SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          # A subset release says so first. `ALL` is the ordinary case and needs
          # no explanation; anything else is a release that does not contain
          # what the repository's plugin list would lead you to expect, and a
          # download whose contents you have to guess at is a bug report later.
          # The value passed the plan job's `[A-Za-z][A-Za-z0-9,]*` check, so it
          # is safe to put in the notes as-is.
          if [ "$PLUGIN_SELECTION" != "ALL" ]; then
            {
              echo "## What is in this release"
              echo
              echo "**Only \`${PLUGIN_SELECTION}\`** — this was a targeted build, not the"
              echo "full suite. Everything else in the repository is unchanged and"
              echo "simply was not compiled for this run."
              echo
            } > release-notes.md
          else
            : > release-notes.md
          fi

          cat >> release-notes.md <<'NOTES'
          ## Tested

          **1002 DSP tests pass, 0 failed** on this revision — on Linux, on
          Windows, and on **ARM64 under emulation**, which is the architecture
          Apple Silicon runs. The Apple-Silicon build is additionally compiled
          with clang and Steinberg's validator passes 47/47 on every plugin.

          ## Installing

          **Windows** — copy the `.vst3` folder into
          `C:\Program Files\Common Files\VST3\`, then rescan in your DAW.
          NOTES

          # The macOS half is written **only if a macOS build was actually in
          # this run**. A Windows-only release that told people how to clear the
          # quarantine on files it does not contain would be describing a
          # download that is not there.
          if ls release/*-macos-*.zip >/dev/null 2>&1; then
          cat >> release-notes.md <<'NOTES'

          **macOS** — copy `.vst3` into `~/Library/Audio/Plug-Ins/VST3/` and
          `.component` into `~/Library/Audio/Plug-Ins/Components/`.

          ### macOS: clear the quarantine first

          These builds are **not code signed**, so macOS quarantines anything
          downloaded and your DAW will report the plugin as damaged, or simply
          not list it. The plugin is fine; the attribute is the problem:

          ```bash
          xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/*.vst3
          xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/*.component
          ```

          Logic caches Audio Unit scans. If a new version does not appear:

          ```bash
          killall -9 AudioComponentRegistrar
          ```

          NOTES
          fi

          cat >> release-notes.md <<'NOTES'

          ### Formats

          Windows builds are VST3, 64-bit only.
          NOTES

          if ls release/*-macos-*.zip >/dev/null 2>&1; then
          cat >> release-notes.md <<'NOTES'
          macOS builds are universal (Apple Silicon and Intel) and include both
          VST3 and Audio Unit — Logic and GarageBand load nothing but AU.

          Full instructions: [docs/BUILD.md](docs/BUILD.md) and
          [docs/BUILD-MACOS.md](docs/BUILD-MACOS.md).
          NOTES
          else
          cat >> release-notes.md <<'NOTES'

          _This release is **Windows only**. The rig is Windows and FL Studio,
          and macOS is not being tested yet — the code builds and validates on
          it, but nobody has loaded these in a Mac DAW. To include Mac binaries,
          run CI with the platforms box set to **all** and tag from that._

          Full instructions: [docs/BUILD.md](docs/BUILD.md).
          NOTES
          fi

          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PLUGIN_SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          # A subset release is marked a pre-release, so it never sits at the
          # top of the releases page as "Latest" for a suite it is not. The
          # notes already say what is in it; this is the same statement made
          # where somebody skimming the list will see it.
          prerelease=()
          title="tezla.spectra $VERSION"
          if [ "$PLUGIN_SELECTION" != "ALL" ]; then
            prerelease=(--prerelease)
            title="tezla.spectra $VERSION -- $PLUGIN_SELECTION only"
          fi

          # --target matters on the manual route: there is no tag yet, so gh
          # creates one, and without it the tag would land on the default branch
          # rather than on the commit that was actually built and tested.
          gh release create "$VERSION" release/*.zip \
            --title "$title" \
            --target "$GITHUB_SHA" \
            "${prerelease[@]}" \
            --notes-file release-notes.md

          echo "### Released $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$VERSION" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
